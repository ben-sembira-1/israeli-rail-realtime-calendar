[tool.poetry]
packages = [{include = "israeli_rail_calendar", from = "src"}]

[tool.poetry.scripts]
israeli-rail-calendar = "israeli_rail_calendar.cli:main"

[project]
name = "israel-rail-calendar"
version = "0.1.0"
description = "Generates ICS calendars for Israel Railways routes"
authors = [
    {name = "Author",email = "author@example.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "icalendar (>=7.2.2,<8.0.0)",
    "pytz (>=2026.2,<2027.0)",
    "requests (>=2.34.2,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pyright (>=1.1.411,<2.0.0)"
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = "."
